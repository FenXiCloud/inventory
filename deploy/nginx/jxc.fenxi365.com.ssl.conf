server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  ssl_certificate /etc/nginx/ssl/jxc.fenxi365.com.crt;
  ssl_certificate_key /etc/nginx/ssl/jxc.fenxi365.com.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_timeout 10m;
  ssl_session_cache builtin:1000 shared:SSL:10m;
  add_header Strict-Transport-Security max-age=15768000;

  server_name jxc.fenxi365.com;
  access_log /var/log/nginx/jxc.fenxi365.com_nginx.log combined;
  index index.html;
  root /usr/share/nginx/html/jxc.fenxi365.com;

  if ($ssl_protocol = "") { return 301 https://$host$request_uri; }

  location ^~ /.well-known/ {
    root /usr/share/nginx/html/jxc.fenxi365.com/;
    default_type text/plain;
    try_files $uri =404;
  }

  location ^~ /api/ {
    # Docker DNS: re-resolve when jxc_* containers recreate
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $jxc_upstream jxc_merchant:8410;
    # variable proxy_pass does not strip location prefix — rewrite manually
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$jxc_upstream;
    proxy_connect_timeout 300s;
    proxy_send_timeout 900;
    proxy_read_timeout 900;
    proxy_buffer_size 32k;
    proxy_buffers 4 64k;
    proxy_busy_buffers_size 128k;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    client_max_body_size 100m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
