version: "3.8"

services:
  jxc_merchant:
    container_name: jxc_merchant
    image: eclipse-temurin:21-jdk
    restart: always
    command:
      - java
      - -server
      - -Xms512m
      - -Xmx512m
      - -Dserver.tomcat.basedir=/tmp
      - -Dlogging.file.name=/logs/merchant.log
      - -Dfile.encoding=UTF-8
      - -Dsun.jnu.encoding=UTF-8
      - -Djava.awt.headless=true
      - -Djava.security.egd=file:/dev/./urandom
      - -jar
      - /server/jxc-0.1.jar
      - --spring.config.additional-location=optional:file:/server/application-db.yml
      - --spring.data.redis.host=contract_redis7
      - --spring.data.redis.port=6379
      - --spring.data.redis.url=
    volumes:
      - ./server:/server:ro
      - ./upload:/upload
      - ./logs:/logs
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SPRING_DATA_REDIS_HOST: contract_redis7
      SPRING_DATA_REDIS_PORT: "6379"
    mem_limit: 768m
    networks:
      - contract_default

  jxc_admin:
    container_name: jxc_admin
    image: eclipse-temurin:21-jdk
    restart: always
    command:
      - java
      - -server
      - -Xms384m
      - -Xmx384m
      - -Dserver.tomcat.basedir=/tmp
      - -Dlogging.file.name=/logs/admin.log
      - -Dfile.encoding=UTF-8
      - -Dsun.jnu.encoding=UTF-8
      - -Djava.awt.headless=true
      - -Djava.security.egd=file:/dev/./urandom
      - -jar
      - /server/jadmin-0.1.jar
      - --spring.config.additional-location=optional:file:/server/application-db.yml
      - --spring.data.redis.host=contract_redis7
      - --spring.data.redis.port=6379
      - --spring.data.redis.url=
    volumes:
      - ./server:/server:ro
      - ./upload:/upload
      - ./logs:/logs
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      SPRING_DATA_REDIS_HOST: contract_redis7
      SPRING_DATA_REDIS_PORT: "6379"
    mem_limit: 512m
    networks:
      - contract_default

networks:
  contract_default:
    external: true
    name: contract_default
