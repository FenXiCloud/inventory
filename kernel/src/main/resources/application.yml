spring:
  lifecycle:
    timeout-per-shutdown-phase: 120s
  profiles:
    include: app,dev
  datasource:
    url: jdbc:mysql://localhost:3306/jxc?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

    hikari:

      keepalive-time: 60000
      max-lifetime: 1500000
      maximum-pool-size: 200
      minimum-idle: 10
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: com.flyemu.share.hibernate.SharePhysicalNamingStrategy
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false
  sqltoy:
    sql-resources-dir: classpath:/sqltoy
    debug: true
  data:
    redis:
      repositories:
        enabled: false
      url: ${REDIS_URL:redis://127.0.0.1:6379}
      database: 5
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 0
  cache:
    redis:
      key-prefix: jxc_
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-empty-json-arrays: true
      WRITE_DATES_AS_TIMESTAMPS: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
logging:
  logback:
    rollingpolicy:
      max-file-size: 2MB
      max-history: 30
server:
  shutdown: graceful
  tomcat:
    basedir:

app:
  upload-root:
  #  阿里短信服务
  aliyun:
    accessKeyId: ${ALIYUN_ACCESS_KEY_ID:}
    accessKeySecret: ${ALIYUN_ACCESS_KEY_SECRET:}
    sms:
      signature: ${ALIYUN_SMS_SIGNATURE:纷析云}
      template-code:
        verification: ${ALIYUN_SMS_VERIFICATION_TEMPLATE:}
        register: ${ALIYUN_SMS_REGISTER_TEMPLATE:}

# ============ 纷析云数电发票开放平台 SDK ============
fenxi:
  app-id: ${FENXI_APP_ID:}
  key: ${FENXI_KEY:}
  endpoint: ${FENXI_ENDPOINT:https://open.fenxi365.com/v1}

# ============ 发票平台本地配置 ============
invoice:
  platform:
    mock-enabled: ${INVOICE_MOCK_ENABLED:true}
    account:
      username: ${INVOICE_USERNAME:}
      password: ${INVOICE_PASSWORD:}
      phone: ${INVOICE_PHONE:}
      real-name: ${INVOICE_REAL_NAME:}
      role-name: ${INVOICE_ROLE_NAME:开票员}
    seller:
      name: ${SELLER_NAME:}
      phone: ${SELLER_PHONE:}
      invoice-type: ${SELLER_INVOICE_TYPE:030}
      bank: ${SELLER_BANK:}
      bank-account: ${SELLER_BANK_ACCOUNT:}
