dependencies {
    implementation project(":kernel")
    implementation('com.itextpdf:itextpdf:5.5.13.3')
    implementation("com.itextpdf:html2pdf:4.0.4")
    implementation("com.itextpdf:font-asian:7.2.4")
    implementation("org.apache.commons:commons-lang3:3.17.0")
    implementation("com.aliyun:dingtalk:1.1.86")
    implementation("com.aliyun:alibaba-dingtalk-service-sdk:2.0.0")
}

bootJar {
    archivesBaseName = 'jxc'
    archiveVersion = '0.1'
    launchScript()
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

